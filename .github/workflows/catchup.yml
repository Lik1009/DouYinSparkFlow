name: DouYin Send Catchup

# 兜底触发：主发送工作流每天 09:00 定时跑，这里再安排几个补充时段，
# 如果当天还没有成功发送就自动触发一次（发送脚本内部有当天幂等，不会重复发）。
on:
  schedule:
    - cron: "17 2 * * *" # 北京时间 10:17
    - cron: "17 4 * * *" # 北京时间 12:17
    - cron: "17 7 * * *" # 北京时间 15:17
  workflow_dispatch:

concurrency:
  group: douyin-catchup
  cancel-in-progress: false

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger send if not succeeded today
        env:
          GH_TOKEN: ${{ secrets.SPARKFLOW_PAT }}
        run: |
          LAST=$(gh api "repos/Luolingli/DouYinSparkFlow/actions/runs?workflow_id=319507627&status=success&per_page=1" \
            --jq '.workflow_runs[0].created_at // ""' 2>/dev/null || echo "")
          TODAY=$(TZ=Asia/Shanghai date +%F)
          echo "今天(北京时间): $TODAY | 最近成功发送: ${LAST:-无}"
          if [[ "$LAST" == "$TODAY"* ]]; then
            echo "今天已成功发送过，跳过"
          else
            echo "今天尚未成功发送，触发发送工作流"
            gh workflow run "DouYin Spark Flow Schedule Run"
          fi
