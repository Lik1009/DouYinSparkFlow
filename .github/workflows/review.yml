name: DouYin Send Review

on:
  workflow_run:
    workflows: ["DouYin Spark Flow Schedule Run"]
    types: [completed]

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: user-data
    steps:
      - uses: actions/checkout@v7
      - name: Download run logs
        uses: actions/download-artifact@v8
        with:
          name: run-logs
          path: logs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Review send result
        env:
          TASKS: ${{ vars.TASKS }}
          MAIN_RESULT: ${{ github.event.workflow_run.conclusion }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          # action_required = 未实际执行，跳过；其余（失败/超时/取消等）都按失败 review
          if [ "$MAIN_RESULT" = "action_required" ]; then
            echo "运行未实际执行（action_required），跳过 review"
            exit 0
          fi
          if [ "$MAIN_RESULT" != "success" ]; then
            echo "运行未成功（$MAIN_RESULT），按失败进行 review"
            MAIN_RESULT="failure"
          fi
          EXPECTED=$(python3 - <<'PY'
          import json, os
          tasks = json.loads(os.environ.get("TASKS", "[]"))
          print(sum(len(t.get("targets", [])) for t in tasks))
          PY
          )
          python utils/review_run.py --main-result "$MAIN_RESULT" --logs-dir logs --expected "$EXPECTED"
