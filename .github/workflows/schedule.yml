name: DouYin Spark Flow Schedule Run
on:
  workflow_dispatch: # 允许手动触发
  schedule: # 定时任务
    - cron: "0 1 * * *" # 每天 1:00 UTC（对应北京时间 9:00）

jobs:
  run-main:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: user-data
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Test Douyin Accessibility
      run: |
        curl -I https://creator.douyin.com/
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Ensure browsers are installed
      run: playwright install chromium --with-deps --only-shell
    - name: Export Github Environment Variables and Secrets to JSON
      env:
        VARS_JSON: ${{ toJson(vars) }}
        SECRETS_JSON: ${{ toJson(secrets) }}
      run: python utils/export_github_env.py
    - name: Run DouYin Spark Flow
      run: python main.py
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: run-logs
        path: logs/
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1

  review:
    # 发送完成后的双重校验：下载日志确认确实发送成功；异常时自动重试一次
    if: always()
    needs: run-main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: user-data
    steps:
      - uses: actions/checkout@v4
      - name: Download run logs
        uses: actions/download-artifact@v4
        with:
          name: run-logs
          path: logs
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Review send result
        id: review
        continue-on-error: true
        env:
          TASKS: ${{ vars.TASKS }}
          MAIN_RESULT: ${{ needs.run-main.result }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          EXPECTED=$(python3 - <<'PY'
          import json, os
          tasks = json.loads(os.environ.get("TASKS", "[]"))
          print(sum(len(t.get("targets", [])) for t in tasks))
          PY
          )
          python utils/review_run.py --main-result "$MAIN_RESULT" --logs-dir logs --expected "$EXPECTED"
      - name: Auto retry once
        if: steps.review.outcome == 'failure' && github.run_attempt == 1
        env:
          GH_TOKEN: ${{ secrets.SPARKFLOW_PAT }}
        run: |
          echo "Review 发现问题，自动重试整个运行一次"
          gh run rerun ${{ github.run_id }} --failed || gh run rerun ${{ github.run_id }}
      - name: Fail on repeated problem
        if: steps.review.outcome == 'failure' && github.run_attempt != 1
        run: |
          echo "连续两次检查未通过，请人工查看日志"
          exit 1
