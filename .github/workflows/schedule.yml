name: DouYin Spark Flow Schedule Run

on:
  workflow_dispatch: # 允许手动触发
  schedule: # 多时段兜底触发，避免单次 cron 被 GitHub 丢弃；脚本内做当天去重
    - cron: "17 1 * * *" # 北京时间 09:17
    - cron: "17 2 * * *" # 北京时间 10:17
    - cron: "17 3 * * *" # 北京时间 11:17
    - cron: "17 4 * * *" # 北京时间 12:17

concurrency:
  group: douyin-send
  cancel-in-progress: false

jobs:
  run-main:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: user-data
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Test Douyin Accessibility
      run: |
        curl -I https://creator.douyin.com/
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Ensure browsers are installed
      run: playwright install chromium --with-deps --only-shell
    - name: Export Github Environment Variables and Secrets to JSON
      env:
        VARS_JSON: ${{ toJson(vars) }}
        SECRETS_JSON: ${{ toJson(secrets) }}
      run: python utils/export_github_env.py
    - name: Run DouYin Spark Flow
      run: python main.py
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: run-logs
        path: logs/
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
