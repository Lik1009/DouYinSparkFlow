name: DouYin Send Debug

# 调试专用：只给指定好友发送（默认 zjj 和 Eve），生产工作流不受影响。
# 输入 targets 用逗号分隔，可填 抖音号/short_id/昵称；留空则只跑流程不发送。
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "调试发送目标（逗号分隔，默认 zjj00000010,84611333990）"
        required: false
        default: "zjj00000010,84611333990"
      bypass_daily_dedup:
        description: "绕过当天去重，允许多轮测试（1=是，0=否）"
        required: false
        default: "1"

concurrency:
  group: douyin-debug
  cancel-in-progress: false

jobs:
  debug-send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: user-data
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ensure browsers are installed
        run: playwright install chromium --with-deps --only-shell
      - name: Export Github Environment Variables and Secrets to JSON
        env:
          VARS_JSON: ${{ toJson(vars) }}
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: python utils/export_github_env.py
      - name: Run debug send
        env:
          DEBUG_TARGETS_RAW: ${{ github.event.inputs.targets }}
          BYPASS_DAILY_DEDUP: ${{ github.event.inputs.bypass_daily_dedup }}
        run: |
          OVERRIDE_TARGETS=$(python3 -c "import json,sys; print(json.dumps([t.strip() for t in sys.argv[1].split(',') if t.strip()]))" "$DEBUG_TARGETS_RAW")
          echo "调试目标: $OVERRIDE_TARGETS"
          OVERRIDE_TARGETS="$OVERRIDE_TARGETS" BYPASS_DAILY_DEDUP="$BYPASS_DAILY_DEDUP" python main.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: run-logs
          path: logs/
