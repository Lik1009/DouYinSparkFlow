name: Secret Hash Check

on:
  workflow_dispatch:

jobs:
  hash:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: user-data
    steps:
      - name: Compute canonical hash
        env:
          COOKIE_SECRET: ${{ secrets.COOKIES_SAKURO_MAI }}
        run: |
          python3 -c "
import hashlib, json, os
v = os.environ['COOKIE_SECRET']
h = hashlib.sha256(json.dumps(json.loads(v), sort_keys=True).encode()).hexdigest()
print(h)
print(h, file=open('hash.txt','w'))
"
      - uses: actions/upload-artifact@v4
        with:
          name: secret-hash
          path: hash.txt